name: Check
on: [push, pull_request]
jobs:
  core-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/test_core.py tests/test_workspace.py -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m traceback_lab doctor
  tiny-model-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test,ml]"
      - run: python -m pytest tests/test_ml.py -q
