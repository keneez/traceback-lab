[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "traceback-lab"
version = "0.2.0"
description = "Reproducible neural bug localization with historical patch reveal"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy==2.3.5",
  "httpx[socks]==0.28.1",
  "tree-sitter==0.25.2",
  "tree-sitter-python==0.25.0",
  "unidiff==0.7.5",
]

[project.optional-dependencies]
ml = [
  "torch==2.7.1",
  "transformers==4.57.1",
  "safetensors==0.6.2",
  "huggingface-hub==0.36.0",
  "scikit-learn>=1.6,<2",
  "PySocks==1.7.1",
]
data = ["datasets>=3,<5"]
test = ["pytest==8.4.2"]

[project.scripts]
traceback-lab = "traceback_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traceback_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

